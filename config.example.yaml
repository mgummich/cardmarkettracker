# =====================================================================
#  Cardmarket Tracker – example configuration
#  Copy to config.yaml and adjust. Docs: https://mgummich.github.io/cardmarkettracker/
#  ${VAR} or ${VAR:-default} is replaced by environment variables
#  (e.g. from the .env file with docker compose).
# =====================================================================

general:
  language: en                # en | de – language of notifications, reports, CLI and log
  interval_minutes: 60        # how often all cards are checked
  jitter_seconds: 120         # random extra delay so requests are not perfectly periodic
  database: data/tracker.db
  timezone: Europe/Berlin
  log_level: INFO
  keep_offers: 20             # cheapest matching offers stored per check
  notify_errors: false        # also send errors (e.g. API down) as notification

# ---------------------------------------------------------------------
# Data source
#   demo     – simulated data to try things out (no credentials needed)
#   mkm_api  – official Cardmarket API (recommended, needs API access)
#   scraper  – reads the public product page (unreliable, bot protection)
# ---------------------------------------------------------------------
provider:
  type: ${CMTRACKER_PROVIDER:-demo}

  # mkm_api:
  #   app_token: ${MKM_APP_TOKEN}
  #   app_secret: ${MKM_APP_SECRET}
  #   access_token: ${MKM_ACCESS_TOKEN}
  #   access_token_secret: ${MKM_ACCESS_TOKEN_SECRET}
  #   max_articles: 300

  scraper:
    locale: en
    request_delay_seconds: 8

# ---------------------------------------------------------------------
# Defaults for all cards (can be overridden per card)
# ---------------------------------------------------------------------
defaults:
  filters:
    languages: [German, English]       # en, de, English, Deutsch, ... or language IDs
    min_condition: EX                  # MT, NM, EX, GD, LP, PL, PO
    foil: false                        # true / false / null (= don't care)
    signed: false
    altered: false
    # seller_countries: [DE, AT]       # only sellers from these countries
    # exclude_seller_countries: [GB]
    # seller_types: [private, professional, powerseller]
    # exclude_sellers: [annoyingSeller123]
    # min_price: 0.10                  # ignore obvious fake / bait listings
  alerts:
    drop_percent: 10                   # low fell by >= 10 % since the last check
    below_reference_percent: 15        # low is >= 15 % below the reference price
    reference: trend                   # trend | avg1 | avg7 | avg30 | low
    all_time_low: true                 # new all-time low in your own history
    cooldown_hours: 12                 # same alert again after 12 h at the earliest (unless the price keeps falling)

# ---------------------------------------------------------------------
# Tracked cards
#   product_id – for mkm_api (product ID; the IDs/URLs below are only examples!)
#   url        – for the scraper (product page on cardmarket.com)
#   key        – optional unique short name (default: derived from the name)
# ---------------------------------------------------------------------
cards:
  - name: "The One Ring (LTR)"
    game: Magic
    product_id: 710549
    url: https://www.cardmarket.com/en/Magic/Products/Singles/The-Lord-of-the-Rings-Tales-of-Middle-earth/The-One-Ring
    alerts:
      max_price: 45.00                 # alert as soon as the cheapest matching offer is <= 45 €
    buy:
      enabled: false                   # auto-buy for this card (also enable it globally!)
      max_price: 40.00
      quantity: 1
      filters:                         # optional stricter filters for buying only
        min_condition: NM
        seller_countries: [DE, AT]

  - name: "Charizard ex (OBF 223)"
    key: charizard-obf-223
    game: Pokemon
    product_id: 732134
    url: https://www.cardmarket.com/en/Pokemon/Products/Singles/Obsidian-Flames/Charizard-ex-V1-OBF223
    filters:
      languages: [German]              # overrides the default languages
      min_condition: NM
    alerts:
      max_price: 25
      below_reference_percent: 20
      reference: avg30

  - name: "Sol Ring (Foil)"
    key: sol-ring-foil
    product_id: 12345
    url: https://www.cardmarket.com/en/Magic/Products/Singles/Commander-Masters/Sol-Ring
    enabled: true
    filters:
      foil: true
      languages: null                  # null = any language
    alerts:
      drop_percent: 20

# ---------------------------------------------------------------------
# Notifications – any number of channels.
#   events: which events a channel receives (alert, report, purchase, error)
# Without entries, messages only go to the log.
# ---------------------------------------------------------------------
notifications:
  - type: console

  # - type: telegram
  #   bot_token: ${TELEGRAM_BOT_TOKEN}
  #   chat_id: ${TELEGRAM_CHAT_ID}

  # - type: discord
  #   webhook_url: ${DISCORD_WEBHOOK_URL}
  #   events: [alert, purchase, error]

  # - type: ntfy
  #   server: https://ntfy.sh
  #   topic: ${NTFY_TOPIC}
  #   priority: 4

  # - type: email
  #   host: smtp.example.com
  #   port: 587
  #   security: starttls             # starttls | ssl | none
  #   username: ${SMTP_USER}
  #   password: ${SMTP_PASSWORD}
  #   sender: tracker@example.com
  #   recipients: [me@example.com]
  #   events: [report]

  # - type: webhook                  # e.g. Home Assistant, n8n, Node-RED
  #   url: https://example.com/hook
  #   headers: { Authorization: "Bearer ${WEBHOOK_TOKEN}" }

# ---------------------------------------------------------------------
# Reports
# ---------------------------------------------------------------------
reports:
  output_dir: data/reports
  daily_time: "08:00"                # null = no automatic daily report
  history_days: 30
  top_offers: 5
  send_summary: true
  attach_html: true                  # attach the HTML report (Telegram/Discord/e-mail)
  # public_url: https://tracker.example.com/reports   # if the web UI is publicly reachable

# ---------------------------------------------------------------------
# Auto-buy (EXPERIMENTAL)
#   dry_run – only simulate and report (recommended for testing)
#   cart    – add to the Cardmarket cart via the API (mkm_api only);
#             payment is still done manually on cardmarket.com
# ---------------------------------------------------------------------
purchasing:
  enabled: false
  mode: dry_run
  max_per_run: 50                    # max. total per check (€, without shipping)
  max_per_month: 200                 # max. total per calendar month

# ---------------------------------------------------------------------
# Web interface (dashboard + configuration in the browser)
#   If a password is set, the browser asks for user/password.
#   Always set it when the interface is reachable from other machines!
# ---------------------------------------------------------------------
web:
  enabled: true
  host: 127.0.0.1                    # automatically 0.0.0.0 in the Docker container
  port: 8080
  username: admin
  password: ${WEB_PASSWORD:-}
