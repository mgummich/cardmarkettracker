services:
  tracker:
    # Fertiges Image aus der GitHub Container Registry (amd64/arm64).
    # Selbst bauen statt herunterladen: docker compose up -d --build
    image: ghcr.io/mgummich/cardmarkettracker:latest
    build: .
    container_name: cardmarket-tracker
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"          # Weboberfläche: http://<host>:8080
    volumes:
      - ./config:/config     # config.yaml (wird beim ersten Start angelegt, per Weboberfläche bearbeitbar)
      - ./data:/srv/data     # Datenbank + Berichte
