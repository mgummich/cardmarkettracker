name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Smoke test CLI
        run: |
          cmtracker --version
          cmtracker -c config.example.yaml validate

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install wheel and check bundled web assets
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python - <<'PY'
          import importlib.resources as r
          web = r.files("cmtracker.web")
          for name in ("templates/dashboard.html", "static/style.css"):
              assert (web / name).is_file(), name
          assert (r.files("cmtracker.reports") / "templates/report.html.j2").is_file()
          print("assets ok")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[docs]'
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cmtracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name cmtracker -p 8080:8080 cmtracker:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/status; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Cardmarket Tracker"
          docker logs cmtracker
          docker rm -f cmtracker
