[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardmarket-tracker"
version = "0.1.0"
description = "Selbst gehosteter Preis-Tracker & Alert-Bot für Cardmarket"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cmtracker = "cmtracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cmtracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
