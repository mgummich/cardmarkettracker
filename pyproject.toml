[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardmarket-tracker"
dynamic = ["version"]
description = "Self-hosted price tracker, alert bot and dashboard for Cardmarket"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mgummich" }]
keywords = ["cardmarket", "mkm", "tcg", "magic-the-gathering", "pokemon", "price-tracker", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17,<0.18", "build>=1.2", "twine>=5", "pre-commit>=3"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocs-static-i18n>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/mgummich/cardmarkettracker"
Documentation = "https://mgummich.github.io/cardmarkettracker/"
Issues = "https://github.com/mgummich/cardmarkettracker/issues"
Changelog = "https://github.com/mgummich/cardmarkettracker/blob/main/CHANGELOG.md"

[project.scripts]
cmtracker = "cmtracker.cli:main"

[tool.hatch.version]
path = "src/cmtracker/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/.github", "/site"]

[tool.hatch.build.targets.wheel]
packages = ["src/cmtracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
