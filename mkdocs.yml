site_name: Cardmarket Tracker
site_description: Self-hosted price tracker, alert bot and dashboard for Cardmarket
site_url: https://mgummich.github.io/cardmarkettracker/
repo_url: https://github.com/mgummich/cardmarkettracker
repo_name: mgummich/cardmarkettracker
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 mgummich – MIT License · Not affiliated with Cardmarket

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: Selbst gehosteter Preis-Tracker, Alert-Bot und Dashboard für Cardmarket
          nav_translations:
            Home: Start
            Getting started: Erste Schritte
            Installation: Installation
            Quickstart: Schnellstart
            Usage: Benutzung
            Web interface: Weboberfläche
            Alerts: Preisalarme
            Reports: Berichte
            Auto-buy: Auto-Kauf
            Configuration: Konfiguration
            Configuration reference: Konfigurationsreferenz
            Data sources: Datenquellen
            Notifications: Benachrichtigungen
            Operations: Betrieb
            Deployment: Deployment
            Security: Sicherheit
            Troubleshooting & FAQ: Fehlersuche & FAQ
            Reference: Referenz
            Command line: Kommandozeile
            JSON API: JSON-API
            Development: Entwicklung
            Architecture: Architektur
            Contributing: Mitmachen
            Releases & CI: Releases & CI
            Changelog: Changelog

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mgummich/cardmarkettracker
    - icon: fontawesome/brands/docker
      link: https://github.com/mgummich/cardmarkettracker/pkgs/container/cardmarkettracker

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Usage:
      - Web interface: usage/web-ui.md
      - Alerts: usage/alerts.md
      - Reports: usage/reports.md
      - Auto-buy: usage/auto-buy.md
  - Configuration:
      - Configuration reference: configuration/reference.md
      - Data sources: configuration/data-sources.md
      - Notifications: configuration/notifications.md
  - Operations:
      - Deployment: operations/deployment.md
      - Security: operations/security.md
      - Troubleshooting & FAQ: operations/troubleshooting.md
  - Reference:
      - Command line: reference/cli.md
      - JSON API: reference/api.md
  - Development:
      - Architecture: development/architecture.md
      - Contributing: development/contributing.md
      - Releases & CI: development/releases.md
  - Changelog: changelog.md
